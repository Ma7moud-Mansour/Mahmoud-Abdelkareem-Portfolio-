<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;}
  .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}
  .btn-primary{background:#2563eb;color:#fff;padding:10px 24px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;transition:all .2s;}
  .btn-primary:hover{background:#1d4ed8;transform:translateY(-1px);}
  .btn-danger{background:#dc2626;color:#fff;padding:6px 14px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;}
  .btn-danger:hover{background:#b91c1c;}
  .btn-edit{background:#0891b2;color:#fff;padding:6px 14px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;}
  .btn-edit:hover{background:#0e7490;}
  .input{width:100%;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 14px;color:#e2e8f0;font-size:14px;outline:none;}
  .input:focus{border-color:#2563eb;}
  .tag-chip{display:inline-flex;align-items:center;gap:4px;background:#1e40af;color:#bfdbfe;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:50;display:flex;align-items:center;justify-content:center;}
  .modal{background:#1e293b;border-radius:20px;padding:32px;width:90%;max-width:640px;max-height:90vh;overflow-y:auto;border:1px solid #334155;}
  .section-title{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#64748b;margin-bottom:16px;}
  .card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;display:flex;gap:16px;align-items:flex-start;transition:border-color .2s;}
  .card:hover{border-color:#2563eb;}
  #toast{position:fixed;bottom:24px;right:24px;z-index:100;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;}
</style>
</head>
<body>

<div id="login-screen" class="min-h-screen flex items-center justify-center p-6">
  <div class="glass rounded-2xl p-6 md:p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-4xl font-black text-blue-500 tracking-tighter mb-2">MA.</div>
      <h1 class="text-2xl font-black">Admin Panel</h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to manage your portfolio</p>
    </div>
    <form id="login-form" onsubmit="doLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Username</label>
        <input id="login-user" class="input" type="text" placeholder="username" required/>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">Password</label>
        <input id="login-pass" class="input" type="password" placeholder="••••••••" required/>
      </div>
      <div id="login-err" class="hidden text-red-400 text-sm font-bold"></div>
      <button class="btn-primary w-full mt-2 text-center" type="submit">Sign In →</button>
    </form>
  </div>
</div>

<div id="dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
  
  <div class="md:hidden flex items-center justify-between p-4 glass border-b border-white/10 z-50">
    <div class="text-2xl font-black text-blue-500 tracking-tighter">MA.</div>
    <button onclick="toggleMobileMenu()" class="text-white p-2">
      <span class="material-symbols-outlined text-[28px]" id="menu-icon">menu</span>
    </button>
  </div>

  <div id="sidebar" class="fixed md:sticky inset-y-0 left-0 w-64 glass border-r border-white/10 flex flex-col p-6 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 h-screen">
    <div class="hidden md:block text-3xl font-black text-blue-500 tracking-tighter mb-2">MA.</div>
    <p class="hidden md:block text-slate-400 text-xs font-bold uppercase tracking-wider mb-8">Portfolio Admin</p>
    <nav class="flex-1 space-y-2 mt-16 md:mt-0">
      <button onclick="showTab('projects')" id="tab-projects" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex items-center gap-3 bg-blue-600/20 text-blue-400">
        <span class="material-symbols-outlined text-[20px]">rocket_launch</span>Projects
      </button>
      <button onclick="showTab('skills')" id="tab-skills" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex items-center gap-3 text-slate-400 hover:text-white hover:bg-white/5">
        <span class="material-symbols-outlined text-[20px]">build</span>Skills
      </button>
    </nav>
    <button onclick="doLogout()" class="flex items-center gap-2 text-slate-500 hover:text-red-400 text-sm font-bold mt-4">
      <span class="material-symbols-outlined text-[18px]">logout</span>Sign Out
    </button>
  </div>

  <div class="flex-1 p-4 md:p-8 w-full min-w-0">
    <div id="pane-projects">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h2 class="text-2xl font-black">Projects</h2>
          <p class="text-slate-400 text-sm">Add, edit and delete portfolio projects</p>
        </div>
        <button class="btn-primary flex items-center justify-center gap-2 w-full sm:w-auto" onclick="openProjectModal()">
          <span class="material-symbols-outlined text-[18px]">add</span>New Project
        </button>
      </div>
      <div id="projects-list" class="space-y-4"><div class="text-slate-400 text-center py-10">Loading...</div></div>
    </div>

    <div id="pane-skills" class="hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
        <div>
          <h2 class="text-2xl font-black">Skills</h2>
          <p class="text-slate-400 text-sm">Manage your tech stack</p>
        </div>
        <button class="btn-primary flex items-center justify-center gap-2 w-full sm:w-auto" onclick="openSkillModal()">
          <span class="material-symbols-outlined text-[18px]">add</span>New Skill
        </button>
      </div>
      <div id="skills-list" class="space-y-4"><div class="text-slate-400 text-center py-10">Loading...</div></div>
    </div>
  </div>
</div>

<div id="project-modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal('project-modal')">
  <div class="modal">
    <h3 id="proj-modal-title" class="text-xl font-black mb-6">Add Project</h3>
    <form id="project-form" onsubmit="saveProject(event)" class="space-y-4">
      <input type="hidden" id="proj-id"/>
      <div class="grid grid-cols-1 gap-4">
        <div>
          <label class="section-title">Title *</label>
          <input id="proj-title" class="input" placeholder="Project name" required/>
        </div>
        <div>
          <label class="section-title">Description *</label>
          <textarea id="proj-desc" class="input" rows="3" placeholder="Short description..." required></textarea>
        </div>

        <div>
          <label class="section-title">Project Image</label>
          <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-start">
            <div class="flex-1">
              <input id="proj-image-url" class="input" placeholder="Or paste image URL"/>
            </div>
            <div>
              <label class="btn-primary cursor-pointer flex items-center justify-center gap-2 w-full" style="padding:10px 16px;">
                <span class="material-symbols-outlined text-[18px]">upload</span>Upload
                <input type="file" id="proj-image-file" accept="image/*" class="hidden" onchange="uploadImage()"/>
              </label>
            </div>
          </div>
          <div id="upload-progress" class="hidden mt-2 text-blue-400 text-xs font-bold">Uploading...</div>
          <div id="image-preview-wrap" class="hidden mt-3">
            <img id="image-preview" class="w-full h-40 object-cover rounded-xl border border-white/10"/>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="section-title">Demo URL</label>
            <input id="proj-demo" class="input" placeholder="https://..."/>
          </div>
          <div>
            <label class="section-title">GitHub URL</label>
            <input id="proj-github" class="input" placeholder="https://github.com/..."/>
          </div>
        </div>
        <div>
          <label class="section-title">Tags (comma-separated)</label>
          <input id="proj-tags" class="input" placeholder="Python, FastAPI, React"/>
        </div>
        <div class="flex items-center gap-3">
          <input type="checkbox" id="proj-flagship" class="w-5 h-5 rounded" style="accent-color:#2563eb"/>
          <label for="proj-flagship" class="font-bold text-sm">Mark as Flagship project</label>
        </div>
        <div class="flex items-center gap-3">
          <input type="checkbox" id="proj-featured" class="w-5 h-5 rounded" style="accent-color:#16a34a"/>
          <label for="proj-featured" class="font-bold text-sm">Featured on Homepage</label>
        </div>
        <div>
          <label class="section-title">Display Order</label>
          <input id="proj-order" class="input" type="number" value="0" min="0"/>
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button class="btn-primary flex-1 order-1 sm:order-2" type="submit">Save Project</button>
        <button type="button" onclick="closeModal('project-modal')" class="flex-1 py-2.5 rounded-xl border border-white/20 font-bold text-sm hover:bg-white/5 order-2 sm:order-1">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="skill-modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal('skill-modal')">
  <div class="modal" style="max-width:400px">
    <h3 id="skill-modal-title" class="text-xl font-black mb-6">Add Skill</h3>
    <form id="skill-form" onsubmit="saveSkill(event)" class="space-y-4">
      <input type="hidden" id="skill-id"/>
      <div>
        <label class="section-title">Skill Name *</label>
        <input id="skill-name" class="input" placeholder="e.g. React / Next.js" required/>
      </div>
      <div>
        <label class="section-title">Category *</label>
        <select id="skill-cat" class="input">
          <option value="Frontend">Frontend</option>
          <option value="Backend">Backend</option>
          <option value="Cloud">Cloud</option>
        </select>
      </div>
      <div>
        <label class="section-title">Order</label>
        <input id="skill-order" class="input" type="number" value="0" min="0"/>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button class="btn-primary flex-1 order-1 sm:order-2" type="submit">Save Skill</button>
        <button type="button" onclick="closeModal('skill-modal')" class="flex-1 py-2.5 rounded-xl border border-white/20 font-bold text-sm hover:bg-white/5 order-2 sm:order-1">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';
let token = localStorage.getItem('admin_token') || '';

// ── Mobile Menu Toggle ───────────────────────────────────────────
function toggleMobileMenu() {
  const sidebar = document.getElementById('sidebar');
  const menuIcon = document.getElementById('menu-icon');
  const isOpen = sidebar.classList.contains('translate-x-0');
  
  if (isOpen) {
    sidebar.classList.remove('translate-x-0');
    sidebar.classList.add('-translate-x-full');
    menuIcon.textContent = 'menu';
  } else {
    sidebar.classList.remove('-translate-x-full');
    sidebar.classList.add('translate-x-0');
    menuIcon.textContent = 'close';
  }
}

// ── Auth ───────────────────────────────────────────────────────
async function doLogin(e) {
  e.preventDefault();
  const err = document.getElementById('login-err');
  err.classList.add('hidden');
  try {
    const r = await fetch(`${API}/api/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: document.getElementById('login-user').value, password: document.getElementById('login-pass').value})
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.detail || 'Invalid credentials'; err.classList.remove('hidden'); return; }
    token = d.access_token;
    localStorage.setItem('admin_token', token);
    showDashboard();
  } catch { err.textContent = 'Connection error — is the backend running?'; err.classList.remove('hidden'); }
}

function doLogout() {
  localStorage.removeItem('admin_token'); token = ''; location.reload();
}

function authHeaders() { return {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'}; }

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  if (!token) return;
  try {
    const r = await fetch(`${API}/api/auth/me`, {headers:{'Authorization':`Bearer ${token}`}});
    if (r.ok) showDashboard();
    else { localStorage.removeItem('admin_token'); token = ''; }
  } catch {}
});

function showDashboard() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadProjects(); loadSkills();
}

// ── Tabs ──────────────────────────────────────────────────────
function showTab(tab) {
  ['projects','skills'].forEach(t => {
    document.getElementById(`pane-${t}`).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById(`tab-${t}`);
    btn.className = t===tab
      ? 'w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex items-center gap-3 bg-blue-600/20 text-blue-400'
      : 'w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex items-center gap-3 text-slate-400 hover:text-white hover:bg-white/5';
  });
  // Close menu on mobile after choosing a tab
  if(window.innerWidth < 768) toggleMobileMenu();
}

// ── Projects ─────────────────────────────────────────────────
async function loadProjects() {
  const list = document.getElementById('projects-list');
  const r = await fetch(`${API}/api/projects`);
  const projects = await r.json();
  if (!projects.length) { list.innerHTML = '<div class="text-slate-400 text-center py-10">No projects yet. Click "New Project" to add one.</div>'; return; }
  list.innerHTML = projects.map(p => `
    <div class="card flex-col sm:flex-row items-stretch sm:items-start gap-4">
      ${p.image_url ? `<img src="${esc(p.image_url)}" class="w-full sm:w-20 h-40 sm:h-20 object-cover rounded-xl flex-shrink-0 border border-white/10"/>` : `<div class="w-full sm:w-20 h-20 bg-blue-600/10 rounded-xl flex-shrink-0 flex items-center justify-center"><span class="material-symbols-outlined text-blue-600/50">image</span></div>`}
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between sm:justify-start gap-2 mb-1">
          <h3 class="font-black text-base truncate">${esc(p.title)}</h3>
          ${p.is_flagship ? '<span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded-full font-black uppercase tracking-wider">Flagship</span>' : ''}
          ${p.is_featured ? '<span class="text-[10px] bg-green-600 text-white px-2 py-0.5 rounded-full font-black uppercase tracking-wider">Featured</span>' : ''}
        </div>
        <p class="text-slate-400 text-sm line-clamp-2 mb-2">${esc(p.description)}</p>
        <div class="flex flex-wrap gap-1">${(p.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>
      </div>
      <div class="flex sm:flex-col gap-2 w-full sm:w-auto mt-2 sm:mt-0">
        <button class="btn-edit flex-1 text-center" onclick="editProject(${p.id})">Edit</button>
        <button class="btn-danger flex-1 text-center" onclick="deleteProject(${p.id},'${esc(p.title)}')">Delete</button>
      </div>
    </div>`).join('');
}

let allProjects = {};
async function editProject(id) {
  const r = await fetch(`${API}/api/projects/${id}`);
  const p = await r.json();
  allProjects[id] = p;
  document.getElementById('proj-modal-title').textContent = 'Edit Project';
  document.getElementById('proj-id').value = p.id;
  document.getElementById('proj-title').value = p.title;
  document.getElementById('proj-desc').value = p.description;
  document.getElementById('proj-image-url').value = p.image_url || '';
  document.getElementById('proj-demo').value = p.demo_url || '';
  document.getElementById('proj-github').value = p.github_url || '';
  document.getElementById('proj-tags').value = (p.tags||[]).join(', ');
  document.getElementById('proj-flagship').checked = p.is_flagship;
  document.getElementById('proj-featured').checked = p.is_featured;
  document.getElementById('proj-order').value = p.order;
  if (p.image_url) { document.getElementById('image-preview').src = p.image_url; document.getElementById('image-preview-wrap').classList.remove('hidden'); }
  else document.getElementById('image-preview-wrap').classList.add('hidden');
  document.getElementById('project-modal').classList.remove('hidden');
}

function openProjectModal() {
  document.getElementById('proj-modal-title').textContent = 'New Project';
  document.getElementById('project-form').reset();
  document.getElementById('proj-id').value = '';
  document.getElementById('image-preview-wrap').classList.add('hidden');
  document.getElementById('project-modal').classList.remove('hidden');
}

async function saveProject(e) {
  e.preventDefault();
  const id = document.getElementById('proj-id').value;
  const tags = document.getElementById('proj-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const body = {
    title: document.getElementById('proj-title').value,
    description: document.getElementById('proj-desc').value,
    image_url: document.getElementById('proj-image-url').value || null,
    demo_url: document.getElementById('proj-demo').value || null,
    github_url: document.getElementById('proj-github').value || null,
    tags, is_flagship: document.getElementById('proj-flagship').checked,
    is_featured: document.getElementById('proj-featured').checked,
    order: parseInt(document.getElementById('proj-order').value) || 0
  };
  const url = id ? `${API}/api/admin/projects/${id}` : `${API}/api/admin/projects`;
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, {method, headers: authHeaders(), body: JSON.stringify(body)});
  if (r.ok) { showToast('Project saved!', 'green'); closeModal('project-modal'); loadProjects(); }
  else { const d = await r.json(); showToast(d.detail || 'Error saving', 'red'); }
}

async function deleteProject(id, title) {
  if (!confirm(`Delete "${title}"?`)) return;
  const r = await fetch(`${API}/api/admin/projects/${id}`, {method:'DELETE', headers: authHeaders()});
  if (r.ok) { showToast('Deleted!', 'red'); loadProjects(); }
}

// ── Image Upload ──────────────────────────────────────────────
async function uploadImage() {
  const file = document.getElementById('proj-image-file').files[0];
  if (!file) return;
  const prog = document.getElementById('upload-progress');
  prog.classList.remove('hidden');
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch(`${API}/api/admin/upload-image`, {method:'POST', headers:{'Authorization':`Bearer ${token}`}, body:fd});
    const d = await r.json();
    if (r.ok) {
      document.getElementById('proj-image-url').value = d.url;
      document.getElementById('image-preview').src = d.url;
      document.getElementById('image-preview-wrap').classList.remove('hidden');
      showToast('Image uploaded!', 'green');
    } else showToast(d.detail || 'Upload failed', 'red');
  } catch { showToast('Upload error', 'red'); }
  finally { prog.classList.add('hidden'); }
}

// Update preview when URL typed manually
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('proj-image-url')?.addEventListener('input', function() {
    if (this.value) { document.getElementById('image-preview').src = this.value; document.getElementById('image-preview-wrap').classList.remove('hidden'); }
    else document.getElementById('image-preview-wrap').classList.add('hidden');
  });
});

// ── Skills ────────────────────────────────────────────────────
async function loadSkills() {
  const list = document.getElementById('skills-list');
  const r = await fetch(`${API}/api/skills`);
  const skills = await r.json();
  if (!skills.length) { list.innerHTML = '<div class="text-slate-400 text-center py-10">No skills yet.</div>'; return; }
  const cats = {}; skills.forEach(s => { if(!cats[s.category]) cats[s.category]=[]; cats[s.category].push(s); });
  list.innerHTML = Object.entries(cats).map(([cat, items]) => `
    <div class="card flex-col">
      <div class="text-xs font-black text-blue-400 uppercase tracking-wider mb-3">${esc(cat)}</div>
      <div class="space-y-2 w-full">${items.map(s => `
        <div class="flex items-center justify-between py-2 px-3 bg-white/5 rounded-xl gap-2">
          <span class="font-bold text-sm truncate">${esc(s.name)}</span>
          <div class="flex gap-2 flex-shrink-0">
            <button class="btn-edit" onclick="editSkill(${s.id},'${esc(s.name)}','${esc(s.category)}',${s.order})">Edit</button>
            <button class="btn-danger" onclick="deleteSkill(${s.id},'${esc(s.name)}')">Delete</button>
          </div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function openSkillModal() {
  document.getElementById('skill-modal-title').textContent = 'Add Skill';
  document.getElementById('skill-form').reset();
  document.getElementById('skill-id').value = '';
  document.getElementById('skill-modal').classList.remove('hidden');
}

function editSkill(id, name, cat, order) {
  document.getElementById('skill-modal-title').textContent = 'Edit Skill';
  document.getElementById('skill-id').value = id;
  document.getElementById('skill-name').value = name;
  document.getElementById('skill-cat').value = cat;
  document.getElementById('skill-order').value = order;
  document.getElementById('skill-modal').classList.remove('hidden');
}

async function saveSkill(e) {
  e.preventDefault();
  const id = document.getElementById('skill-id').value;
  const body = { name: document.getElementById('skill-name').value, category: document.getElementById('skill-cat').value, order: parseInt(document.getElementById('skill-order').value)||0 };
  const url = id ? `${API}/api/admin/skills/${id}` : `${API}/api/admin/skills`;
  const r = await fetch(url, {method: id?'PUT':'POST', headers: authHeaders(), body: JSON.stringify(body)});
  if (r.ok) { showToast('Skill saved!', 'green'); closeModal('skill-modal'); loadSkills(); }
  else showToast('Error saving skill', 'red');
}

async function deleteSkill(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  const r = await fetch(`${API}/api/admin/skills/${id}`, {method:'DELETE', headers: authHeaders()});
  if (r.ok) { showToast('Deleted!', 'red'); loadSkills(); }
}

// ── Helpers ──────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color==='green' ? '#16a34a' : '#dc2626';
  t.style.color = '#fff';
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 3000);
}
</script>
